<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ВИДЕОРЕДАКТОР С ЭФФЕКТАМИ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0a0a0a;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            color: #fff;
        }
        
        #videoSection {
            flex: 1;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            position: relative;
        }
        
        canvas {
            height: 100vh;
            width: auto;
            max-width: 100%;
            object-fit: contain;
            background: #000;
            display: block;
        }
        
        #controls {
            width: 320px;
            min-width: 320px;
            height: 100vh;
            background: #111;
            padding: 15px;
            overflow-y: auto;
            border-left: 1px solid #222;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        
        #controls::-webkit-scrollbar {
            width: 4px;
        }
        #controls::-webkit-scrollbar-track {
            background: #111;
        }
        #controls::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }
        
        .section-title {
            color: #666;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 8px 0 4px 0;
            padding-bottom: 4px;
            border-bottom: 1px solid #1a1a1a;
        }
        
        .effect-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
        }
        
        #controls button {
            background: #1a1a1a;
            color: #aaa;
            border: 1px solid #222;
            padding: 5px 6px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 10px;
            font-weight: 500;
            transition: all 0.2s;
            text-align: center;
            white-space: nowrap;
        }
        
        #controls button:hover {
            background: #252525;
            color: #fff;
            border-color: #333;
        }
        
        #controls button.active {
            background: #ff3366;
            color: #fff;
            border-color: #ff3366;
        }
        
        #controls button.play-btn {
            background: #00ff88;
            color: #000;
            border-color: #00ff88;
            font-weight: 700;
        }
        
        .full-width {
            grid-column: 1 / -1;
        }
        
        .effect-name {
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            padding: 8px 0 4px 0;
            text-align: center;
            font-family: monospace;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #ff3366, #ff6633);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .info-text {
            color: #444;
            font-size: 9px;
            text-align: center;
            padding: 6px 0;
            border-top: 1px solid #1a1a1a;
            margin-top: auto;
        }
        
        .slider-container {
            margin: 3px 0 6px 0;
        }
        
        .slider-container label {
            font-size: 9px;
            color: #666;
            display: block;
            margin-bottom: 2px;
        }
        
        .slider-container input[type="range"] {
            width: 100%;
            height: 3px;
            -webkit-appearance: none;
            background: #222;
            border-radius: 2px;
            outline: none;
        }
        
        .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ff3366;
            cursor: pointer;
        }
        
        .color-picker {
            display: flex;
            gap: 6px;
            align-items: center;
            margin: 3px 0;
        }
        
        .color-picker input[type="color"] {
            width: 25px;
            height: 25px;
            border: 2px solid #333;
            border-radius: 4px;
            background: none;
            cursor: pointer;
            padding: 0;
        }
        
        .color-picker label {
            font-size: 9px;
            color: #666;
        }
        
        .text-input {
            background: #1a1a1a;
            border: 1px solid #222;
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            width: 100%;
            margin: 2px 0;
        }
        
        .text-input:focus {
            outline: none;
            border-color: #ff3366;
        }
    </style>
</head>
<body>

    <div id="videoSection">
        <canvas id="canvas"></canvas>
    </div>

    <div id="controls">
        <div class="effect-name" id="effectName">🎬 METAIMPERIYA</div>
        
        <div class="section-title">📝 Текст на фоне</div>
        <input type="text" class="text-input" id="bgText" value="METAIMPERIYA" placeholder="Введи текст для фона">
        <div class="color-picker">
            <input type="color" id="textColor" value="#ff3366">
            <label>Цвет текста</label>
        </div>
        
        <div class="section-title">🎨 Фон</div>
        <div class="color-picker">
            <input type="color" id="bgColor" value="#0a0a0a">
            <label>Цвет фона</label>
        </div>
        <button onclick="toggleGrid()" class="full-width" style="background:#1a1a1a;">🔲 Сетка (прозрачность)</button>
        
        <div class="section-title">🎬 Эффекты видео</div>
        <div class="effect-grid">
            <button onclick="setEffect('original')" class="active">Оригинал</button>
            <button onclick="setEffect('glitch')">Глитч</button>
            <button onclick="setEffect('pixel')">Пиксели</button>
            <button onclick="setEffect('blur')">Размытие</button>
            <button onclick="setEffect('vhs')">VHS</button>
            <button onclick="setEffect('invert')">Инверсия</button>
        </div>
        
        <div class="section-title">✨ Спецэффекты (фон)</div>
        <div class="effect-grid">
            <button onclick="setBgEffect('none')" class="active">Нет</button>
            <button onclick="setBgEffect('matrix')">Матрица</button>
            <button onclick="setBgEffect('rain')">Дождь</button>
            <button onclick="setBgEffect('particles')">Частицы</button>
            <button onclick="setBgEffect('waves')">Волны</button>
            <button onclick="setBgEffect('fire')">Огонь</button>
        </div>
        
        <div class="section-title">🎮 Управление</div>
        <div class="effect-grid">
            <button onclick="togglePlay()" class="play-btn full-width" id="playBtn">⏸️ ПАУЗА</button>
            <button onclick="resetVideo()" class="full-width" style="background:#1a1a1a;">🔄 Перезапустить</button>
        </div>
        
        <div class="slider-container">
            <label>🎚️ Интенсивность: <span id="intensityValue">100%</span></label>
            <input type="range" id="intensity" min="0" max="200" value="100">
        </div>
        
        <div class="slider-container">
            <label>🔍 Прозрачность видео: <span id="opacityValue">100%</span></label>
            <input type="range" id="opacity" min="0" max="100" value="100">
        </div>
        
        <div class="slider-container">
            <label>📏 Размер текста: <span id="textSizeValue">48</span></label>
            <input type="range" id="textSize" min="10" max="120" value="48">
        </div>
        
        <div class="info-text">
            ⚡ Видео + фон + текст + спецэффекты | METAIMPERIYA
        </div>
    </div>

    <script>
        // =============================================
        // ВИДЕОРЕДАКТОР С ФОНОМ И ТЕКСТОМ
        // =============================================

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const effectName = document.getElementById('effectName');
        
        // Элементы управления
        const intensitySlider = document.getElementById('intensity');
        const intensityValue = document.getElementById('intensityValue');
        const opacitySlider = document.getElementById('opacity');
        const opacityValue = document.getElementById('opacityValue');
        const textSizeSlider = document.getElementById('textSize');
        const textSizeValue = document.getElementById('textSizeValue');
        const bgColorInput = document.getElementById('bgColor');
        const textColorInput = document.getElementById('textColor');
        const bgTextInput = document.getElementById('bgText');

        let showGrid = false;
        let currentEffect = 'original';
        let currentBgEffect = 'none';
        let isPlaying = true;
        let intensity = 1.0;
        let opacity = 1.0;
        let textSize = 48;
        let time = 0;

        // Настройки
        intensitySlider.addEventListener('input', () => {
            intensity = intensitySlider.value / 100;
            intensityValue.textContent = Math.round(intensity * 100) + '%';
        });

        opacitySlider.addEventListener('input', () => {
            opacity = opacitySlider.value / 100;
            opacityValue.textContent = Math.round(opacity * 100) + '%';
        });

        textSizeSlider.addEventListener('input', () => {
            textSize = parseInt(textSizeSlider.value);
            textSizeValue.textContent = textSize;
        });

        // Размер канваса
        function resizeCanvas() {
            const section = document.getElementById('videoSection');
            canvas.width = section.clientWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Загружаем ВЕБМ видео
        const video = document.createElement('video');
        video.src = '0803(1).webm';
        video.loop = true;
        video.muted = true;
        video.playsInline = true;
        video.load();

        video.addEventListener('loadeddata', () => {
            video.play();
            render();
            console.log('🎬 Видео загружено!');
        });

        function toggleGrid() {
            showGrid = !showGrid;
            event.target.style.background = showGrid ? '#ff3366' : '#1a1a1a';
            event.target.style.color = showGrid ? '#fff' : '#aaa';
        }

        // =============================================
        // ФУНКЦИИ ДЛЯ ФОНА (СПЕЦЭФФЕКТЫ)
        // =============================================

        function drawMatrix() {
            const cols = Math.floor(canvas.width / 20);
            const rows = Math.floor(canvas.height / 20);
            ctx.font = '16px monospace';
            ctx.fillStyle = '#00ff88';
            ctx.shadowColor = '#00ff88';
            ctx.shadowBlur = 10;
            
            for (let i = 0; i < cols; i++) {
                const x = i * 20;
                const y = ((time * 50 + i * 30) % (canvas.height + 20)) - 10;
                const char = String.fromCharCode(0x30A0 + Math.random() * 96);
                ctx.fillStyle = `rgba(0, 255, 136, ${0.1 + Math.random() * 0.3})`;
                ctx.fillText(char, x, y);
            }
            ctx.shadowBlur = 0;
        }

        function drawRain() {
            for (let i = 0; i < 100; i++) {
                const x = (i * 13 + time * 20) % canvas.width;
                const y = (i * 7 + time * 150) % canvas.height;
                const length = 10 + Math.random() * 20;
                ctx.strokeStyle = `rgba(100, 150, 255, ${0.1 + Math.random() * 0.3})`;
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(x - 2, y + length);
                ctx.stroke();
            }
        }

        function drawParticles() {
            for (let i = 0; i < 50; i++) {
                const x = (i * 37 + time * 30) % canvas.width;
                const y = (i * 53 + time * 20) % canvas.height;
                const size = 2 + Math.random() * 4;
                const hue = (i * 30 + time * 20) % 360;
                ctx.fillStyle = `hsla(${hue}, 100%, 70%, ${0.3 + Math.random() * 0.5})`;
                ctx.shadowColor = `hsla(${hue}, 100%, 70%, 0.5)`;
                ctx.shadowBlur = 15;
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.shadowBlur = 0;
        }

        function drawWaves() {
            for (let i = 0; i < canvas.width; i += 2) {
                const y = canvas.height / 2 + Math.sin(i * 0.02 + time * 2) * 50 + 
                         Math.sin(i * 0.03 + time * 1.5) * 30;
                ctx.fillStyle = `hsla(${i * 0.1 + time * 20}, 80%, 60%, 0.1)`;
                ctx.fillRect(i, y, 2, 2);
            }
        }

        function drawFire() {
            for (let i = 0; i < 200; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                const size = 2 + Math.random() * 6;
                const alpha = 0.1 + Math.random() * 0.3;
                const hue = 20 + Math.random() * 40;
                ctx.fillStyle = `hsla(${hue}, 100%, ${50 + Math.random() * 30}%, ${alpha})`;
                ctx.shadowColor = `hsla(${hue}, 100%, 50%, 0.3)`;
                ctx.shadowBlur = 20;
                ctx.beginPath();
                ctx.arc(x, y + Math.sin(time + i) * 10, size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.shadowBlur = 0;
        }

        // =============================================
        // ГЛАВНЫЙ РЕНДЕР
        // =============================================

        function render() {
            time += 0.02;

            // Очищаем канвас
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. РИСУЕМ ФОН
            ctx.fillStyle = bgColorInput.value;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. РИСУЕМ СПЕЦЭФФЕКТЫ НА ФОНЕ
            switch (currentBgEffect) {
                case 'matrix':
                    drawMatrix();
                    break;
                case 'rain':
                    drawRain();
                    break;
                case 'particles':
                    drawParticles();
                    break;
                case 'waves':
                    drawWaves();
                    break;
                case 'fire':
                    drawFire();
                    break;
            }

            // 3. РИСУЕМ ТЕКСТ НА ФОНЕ (ЗА ВИДЕО)
            if (bgTextInput.value) {
                ctx.save();
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.font = `bold ${textSize}px Arial`;
                
                // Тень для читаемости
                ctx.shadowColor = 'rgba(0,0,0,0.8)';
                ctx.shadowBlur = 20;
                
                // Множество копий текста для эффекта
                for (let i = -3; i <= 3; i++) {
                    for (let j = -3; j <= 3; j++) {
                        const offsetX = i * (textSize * 0.3);
                        const offsetY = j * (textSize * 0.3) + Math.sin(time + i + j) * 10;
                        ctx.fillStyle = textColorInput.value;
                        ctx.globalAlpha = 0.05 + Math.abs(i) * 0.02 + Math.abs(j) * 0.02;
                        ctx.fillText(
                            bgTextInput.value,
                            canvas.width / 2 + offsetX,
                            canvas.height / 2 + offsetY + Math.sin(time * 0.5 + i) * 30
                        );
                    }
                }
                
                ctx.restore();
            }

            // 4. РИСУЕМ СЕТКУ (проверка прозрачности)
            if (showGrid) {
                const size = 20;
                for (let y = 0; y < canvas.height; y += size) {
                    for (let x = 0; x < canvas.width; x += size) {
                        ctx.fillStyle = ((Math.floor(x / size) + Math.floor(y / size)) % 2 === 0) 
                            ? 'rgba(50,50,50,0.5)' 
                            : 'rgba(200,200,200,0.5)';
                        ctx.fillRect(x, y, size, size);
                    }
                }
            }

            // 5. РИСУЕМ ВИДЕО (ПЕРВЫЙ ПЛАН)
            if (video.readyState >= 2 && isPlaying) {
                const videoW = video.videoWidth;
                const videoH = video.videoHeight;
                const canvasW = canvas.width;
                const canvasH = canvas.height;
                const ratio = videoW / videoH;

                let drawW, drawH, offsetX, offsetY;
                if (ratio > canvasW / canvasH) {
                    drawW = canvasW;
                    drawH = canvasW / ratio;
                    offsetX = 0;
                    offsetY = (canvasH - drawH) / 2;
                } else {
                    drawH = canvasH;
                    drawW = canvasH * ratio;
                    offsetX = (canvasW - drawW) / 2;
                    offsetY = 0;
                }

                // Рисуем видео с прозрачностью
                ctx.save();
                ctx.globalAlpha = opacity;
                ctx.drawImage(video, offsetX, offsetY, drawW, drawH);
                ctx.restore();

                // Применяем эффект к видео
                if (currentEffect !== 'original') {
                    applyEffectToVideo(currentEffect);
                }
            }

            requestAnimationFrame(render);
        }

        // =============================================
        // ЭФФЕКТЫ ДЛЯ ВИДЕО
        // =============================================

        function applyEffectToVideo(effect) {
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            
            switch (effect) {
                case 'glitch':
                    const shift = Math.floor(Math.random() * 15 * intensity) + 3;
                    for (let i = 0; i < data.length; i += 4) {
                        if (i + shift * 4 < data.length && data[i + 3] > 10) {
                            data[i] = data[i + shift * 4];
                            data[i + 1] = data[i + shift * 4 + 1];
                            data[i + 2] = data[i + shift * 4 + 2];
                        }
                    }
                    for (let i = 0; i < data.length; i += 4) {
                        if (Math.random() < 0.005 * intensity && data[i + 3] > 10) {
                            data[i] = 255;
                            data[i + 1] = 255;
                            data[i + 2] = 255;
                        }
                    }
                    break;
                    
                case 'pixel':
                    const size = Math.max(4, Math.floor(12 / intensity));
                    const tempData = new Uint8ClampedArray(data);
                    for (let y = 0; y < canvas.height; y += size) {
                        for (let x = 0; x < canvas.width; x += size) {
                            let r = 0, g = 0, b = 0, a = 0, count = 0;
                            for (let dy = 0; dy < size && y + dy < canvas.height; dy++) {
                                for (let dx = 0; dx < size && x + dx < canvas.width; dx++) {
                                    const i = ((y + dy) * canvas.width + (x + dx)) * 4;
                                    r += tempData[i];
                                    g += tempData[i + 1];
                                    b += tempData[i + 2];
                                    a += tempData[i + 3];
                                    count++;
                                }
                            }
                            r /= count; g /= count; b /= count; a /= count;
                            ctx.fillStyle = `rgba(${r},${g},${b},${a/255})`;
                            ctx.fillRect(x, y, size, size);
                        }
                    }
                    return;
                    
                case 'blur':
                    const radius = Math.max(1, Math.floor(3 * intensity));
                    const blurData = new Uint8ClampedArray(data);
                    for (let y = radius; y < canvas.height - radius; y++) {
                        for (let x = radius; x < canvas.width - radius; x++) {
                            let r = 0, g = 0, b = 0, a = 0, count = 0;
                            for (let dy = -radius; dy <= radius; dy++) {
                                for (let dx = -radius; dx <= radius; dx++) {
                                    const i = ((y + dy) * canvas.width + (x + dx)) * 4;
                                    if (i < data.length && i >= 0) {
                                        r += blurData[i];
                                        g += blurData[i + 1];
                                        b += blurData[i + 2];
                                        a += blurData[i + 3];
                                        count++;
                                    }
                                }
                            }
                            const i = (y * canvas.width + x) * 4;
                            data[i] = r / count;
                            data[i + 1] = g / count;
                            data[i + 2] = b / count;
                            data[i + 3] = a / count;
                        }
                    }
                    break;
                    
                case 'vhs':
                    for (let i = 0; i < data.length; i += 4) {
                        if (Math.random() < 0.02 * intensity && data[i + 3] > 10) {
                            data[i] = Math.random() * 255;
                            data[i + 1] = Math.random() * 255;
                            data[i + 2] = Math.random() * 255;
                        }
                    }
                    for (let y = 0; y < canvas.height; y += 8) {
                        if (Math.random() < 0.1 * intensity) {
                            for (let x = 0; x < canvas.width; x++) {
                                const i = (y * canvas.width + x) * 4;
                                if (i < data.length && data[i + 3] > 10) {
                                    data[i] = data[i] * 0.2;
                                    data[i + 1] = data[i + 1] * 0.2;
                                    data[i + 2] = data[i + 2] * 0.2;
                                }
                            }
                        }
                    }
                    break;
                    
                case 'invert':
                    for (let i = 0; i < data.length; i += 4) {
                        if (data[i + 3] > 10) {
                            data[i] = 255 - data[i];
                            data[i + 1] = 255 - data[i + 1];
                            data[i + 2] = 255 - data[i + 2];
                        }
                    }
                    break;
            }
            
            ctx.putImageData(imageData, 0, 0);
        }

        // =============================================
        // УПРАВЛЕНИЕ
        // =============================================

        function setEffect(effect) {
            currentEffect = effect;
            const names = {
                original: '🎬 METAIMPERIYA',
                glitch: '💥 Глитч',
                pixel: '🧊 Пиксели',
                blur: '🌫️ Размытие',
                vhs: '📼 VHS',
                invert: '🎨 Инверсия'
            };
            effectName.textContent = names[effect] || effect;
            
            document.querySelectorAll('.effect-grid button').forEach(btn => {
                btn.classList.remove('active');
            });
            if (event && event.target) {
                event.target.classList.add('active');
            }
        }

        function setBgEffect(effect) {
            currentBgEffect = effect;
            document.querySelectorAll('.effect-grid button').forEach(btn => {
                btn.classList.remove('active');
            });
            if (event && event.target) {
                event.target.classList.add('active');
            }
        }

        function togglePlay() {
            isPlaying = !isPlaying;
            const btn = document.getElementById('playBtn');
            if (isPlaying) {
                video.play();
                btn.textContent = '⏸️ ПАУЗА';
                btn.style.background = '#00ff88';
                btn.style.color = '#000';
            } else {
                video.pause();
                btn.textContent = '▶️ ВОСПРОИЗВЕДЕНИЕ';
                btn.style.background = '#ff3366';
                btn.style.color = '#fff';
            }
        }

        function resetVideo() {
            video.currentTime = 0;
            if (!isPlaying) {
                isPlaying = true;
                video.play();
                document.getElementById('playBtn').textContent = '⏸️ ПАУЗА';
                document.getElementById('playBtn').style.background = '#00ff88';
                document.getElementById('playBtn').style.color = '#000';
            }
        }

        video.load();
        console.log('🔥 ВИДЕОРЕДАКТОР ГОТОВ!');
    </script>
</body>
</html>
