<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ВИДЕО С ПРОЗРАЧНОСТЬЮ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0a0a0a;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            color: #fff;
        }
        
        #videoSection {
            flex: 1;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            position: relative;
        }
        
        canvas {
            height: 100vh;
            width: auto;
            max-width: 100%;
            object-fit: contain;
            background: #000;
            display: block;
        }
        
        #controls {
            width: 280px;
            min-width: 280px;
            height: 100vh;
            background: #111;
            padding: 20px 15px;
            overflow-y: auto;
            border-left: 1px solid #222;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        #controls::-webkit-scrollbar {
            width: 4px;
        }
        #controls::-webkit-scrollbar-track {
            background: #111;
        }
        #controls::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }
        
        .section-title {
            color: #666;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 10px 0 6px 0;
            padding-bottom: 6px;
            border-bottom: 1px solid #1a1a1a;
        }
        
        .effect-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
        }
        
        #controls button {
            background: #1a1a1a;
            color: #aaa;
            border: 1px solid #222;
            padding: 6px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 500;
            transition: all 0.2s;
            text-align: center;
            white-space: nowrap;
        }
        
        #controls button:hover {
            background: #252525;
            color: #fff;
            border-color: #333;
        }
        
        #controls button.active {
            background: #ff3366;
            color: #fff;
            border-color: #ff3366;
        }
        
        #controls button.play-btn {
            background: #00ff88;
            color: #000;
            border-color: #00ff88;
            font-weight: 700;
        }
        
        #controls button.play-btn:hover {
            background: #00ff99;
        }
        
        .full-width {
            grid-column: 1 / -1;
        }
        
        .effect-name {
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            padding: 12px 0 6px 0;
            text-align: center;
            font-family: monospace;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #ff3366, #ff6633);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .info-text {
            color: #444;
            font-size: 10px;
            text-align: center;
            padding: 8px 0;
            border-top: 1px solid #1a1a1a;
            margin-top: auto;
        }
        
        .slider-container {
            margin: 4px 0 8px 0;
        }
        
        .slider-container label {
            font-size: 10px;
            color: #666;
            display: block;
            margin-bottom: 2px;
        }
        
        .slider-container input[type="range"] {
            width: 100%;
            height: 4px;
            -webkit-appearance: none;
            background: #222;
            border-radius: 2px;
            outline: none;
        }
        
        .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff3366;
            cursor: pointer;
        }
        
        .color-picker {
            display: flex;
            gap: 8px;
            align-items: center;
            margin: 4px 0;
        }
        
        .color-picker input[type="color"] {
            width: 30px;
            height: 30px;
            border: 2px solid #333;
            border-radius: 6px;
            background: none;
            cursor: pointer;
            padding: 0;
        }
        
        .color-picker label {
            font-size: 10px;
            color: #666;
        }
    </style>
</head>
<body>

    <div id="videoSection">
        <canvas id="canvas"></canvas>
    </div>

    <div id="controls">
        <div class="effect-name" id="effectName">🎬 Прозрачное видео</div>
        
        <div class="section-title">🎨 Фон</div>
        <div class="color-picker">
            <input type="color" id="bgColor" value="#000000">
            <label>Цвет фона (подложка)</label>
        </div>
        <button onclick="toggleGrid()" class="full-width" style="background:#1a1a1a;">🔲 Показать сетку (проверка прозрачности)</button>
        
        <div class="section-title">🎬 Эффекты</div>
        <div class="effect-grid">
            <button onclick="setEffect('original')" class="active">Оригинал</button>
            <button onclick="setEffect('glitch')">Глитч</button>
            <button onclick="setEffect('pixel')">Пиксели</button>
            <button onclick="setEffect('blur')">Размытие</button>
            <button onclick="setEffect('vhs')">VHS</button>
            <button onclick="setEffect('invert')">Инверсия</button>
            <button onclick="setEffect('sepia')">Сепия</button>
            <button onclick="setEffect('negative')">Негатив</button>
            <button onclick="setEffect('posterize')">Постеризация</button>
            <button onclick="setEffect('emboss')">Тиснение</button>
            <button onclick="setEffect('edge')">Контуры</button>
            <button onclick="setEffect('oil')">Масло</button>
        </div>
        
        <div class="section-title">🎮 Управление</div>
        <div class="effect-grid">
            <button onclick="togglePlay()" class="play-btn full-width" id="playBtn">⏸️ ПАУЗА</button>
            <button onclick="resetVideo()" class="full-width" style="background:#1a1a1a;">🔄 Перезапустить</button>
        </div>
        
        <div class="slider-container">
            <label>🎚️ Интенсивность: <span id="intensityValue">100%</span></label>
            <input type="range" id="intensity" min="0" max="200" value="100">
        </div>
        
        <div class="slider-container">
            <label>🔍 Прозрачность видео: <span id="opacityValue">100%</span></label>
            <input type="range" id="opacity" min="0" max="100" value="100">
        </div>
        
        <div class="info-text">
            ⚡ Видео с прозрачностью | Накладывай на что хочешь
        </div>
    </div>

    <script>
        // =============================================
        // ВИДЕО С ПРОЗРАЧНОСТЬЮ - ПОЛНАЯ МОЩЬ
        // =============================================

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const effectName = document.getElementById('effectName');
        const intensitySlider = document.getElementById('intensity');
        const intensityValue = document.getElementById('intensityValue');
        const opacitySlider = document.getElementById('opacity');
        const opacityValue = document.getElementById('opacityValue');
        const bgColorInput = document.getElementById('bgColor');

        let showGrid = false;
        let currentEffect = 'original';
        let isPlaying = true;
        let intensity = 1.0;
        let opacity = 1.0;

        // Настройка интенсивности
        intensitySlider.addEventListener('input', () => {
            intensity = intensitySlider.value / 100;
            intensityValue.textContent = Math.round(intensity * 100) + '%';
        });

        // Настройка прозрачности
        opacitySlider.addEventListener('input', () => {
            opacity = opacitySlider.value / 100;
            opacityValue.textContent = Math.round(opacity * 100) + '%';
        });

        // Цвет фона
        bgColorInput.addEventListener('input', () => {
            // Просто меняем цвет, канвас обновится в рендере
        });

        // Размер канваса
        function resizeCanvas() {
            const section = document.getElementById('videoSection');
            canvas.width = section.clientWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Загружаем ВЕБМ видео (поддерживает прозрачность!)
        const video = document.createElement('video');
        video.src = '0803(1).webm';  // ТВОЕ НОВОЕ ВИДЕО
        video.loop = true;
        video.muted = true;
        video.playsInline = true;
        video.load();

        video.addEventListener('loadeddata', () => {
            video.play();
            render();
            console.log('🎬 Видео с альфа-каналом загружено!');
        });

        // Функция рисования сетки (проверка прозрачности)
        function drawGrid() {
            const size = 20;
            for (let y = 0; y < canvas.height; y += size) {
                for (let x = 0; x < canvas.width; x += size) {
                    ctx.fillStyle = ((Math.floor(x / size) + Math.floor(y / size)) % 2 === 0) 
                        ? 'rgba(50,50,50,0.5)' 
                        : 'rgba(200,200,200,0.5)';
                    ctx.fillRect(x, y, size, size);
                }
            }
        }

        function toggleGrid() {
            showGrid = !showGrid;
            event.target.style.background = showGrid ? '#ff3366' : '#1a1a1a';
            event.target.style.color = showGrid ? '#fff' : '#aaa';
        }

        // ГЛАВНЫЙ РЕНДЕР
        function render() {
            if (video.readyState >= 2) {
                // Очищаем канвас
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // РИСУЕМ ФОН (подложка)
                ctx.fillStyle = bgColorInput.value;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // СЕТКА ДЛЯ ПРОВЕРКИ ПРОЗРАЧНОСТИ
                if (showGrid) {
                    drawGrid();
                }

                // РИСУЕМ ВИДЕО С ПРОЗРАЧНОСТЬЮ
                const videoW = video.videoWidth;
                const videoH = video.videoHeight;
                const canvasW = canvas.width;
                const canvasH = canvas.height;
                const ratio = videoW / videoH;

                let drawW, drawH, offsetX, offsetY;
                if (ratio > canvasW / canvasH) {
                    drawW = canvasW;
                    drawH = canvasW / ratio;
                    offsetX = 0;
                    offsetY = (canvasH - drawH) / 2;
                } else {
                    drawH = canvasH;
                    drawW = canvasH * ratio;
                    offsetX = (canvasW - drawW) / 2;
                    offsetY = 0;
                }

                // Сохраняем контекст для прозрачности
                ctx.save();
                ctx.globalAlpha = opacity;

                // Рисуем видео с альфа-каналом (если есть)
                ctx.drawImage(video, offsetX, offsetY, drawW, drawH);

                // Применяем эффект (с учетом прозрачности)
                if (currentEffect !== 'original') {
                    applyEffect(currentEffect);
                }

                ctx.restore();
            }

            requestAnimationFrame(render);
        }

        // =============================================
        // ВСЕ ЭФФЕКТЫ (работают с прозрачностью)
        // =============================================

        function applyEffect(effect) {
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            
            switch (effect) {
                case 'glitch':
                    applyGlitch(data);
                    break;
                case 'pixel':
                    applyPixelate();
                    return;
                case 'blur':
                    applyBlur();
                    return;
                case 'vhs':
                    applyVHS(data);
                    break;
                case 'invert':
                    applyInvert(data);
                    break;
                case 'sepia':
                    applySepia(data);
                    break;
                case 'negative':
                    applyNegative(data);
                    break;
                case 'posterize':
                    applyPosterize(data);
                    break;
                case 'emboss':
                    applyEmboss(data);
                    break;
                case 'edge':
                    applyEdge(data);
                    break;
                case 'oil':
                    applyOil();
                    return;
            }
            
            ctx.putImageData(imageData, 0, 0);
        }

        function applyGlitch(data) {
            const shift = Math.floor(Math.random() * 15 * intensity) + 3;
            for (let i = 0; i < data.length; i += 4) {
                if (i + shift * 4 < data.length && data[i + 3] > 10) {
                    data[i] = data[i + shift * 4];
                    data[i + 1] = data[i + shift * 4 + 1];
                    data[i + 2] = data[i + shift * 4 + 2];
                }
            }
            for (let i = 0; i < data.length; i += 4) {
                if (Math.random() < 0.005 * intensity && data[i + 3] > 10) {
                    data[i] = 255;
                    data[i + 1] = 255;
                    data[i + 2] = 255;
                }
            }
        }

        function applyPixelate() {
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            const size = Math.max(4, Math.floor(12 / intensity));
            const tempData = new Uint8ClampedArray(data);
            
            for (let y = 0; y < canvas.height; y += size) {
                for (let x = 0; x < canvas.width; x += size) {
                    let r = 0, g = 0, b = 0, a = 0, count = 0;
                    for (let dy = 0; dy < size && y + dy < canvas.height; dy++) {
                        for (let dx = 0; dx < size && x + dx < canvas.width; dx++) {
                            const i = ((y + dy) * canvas.width + (x + dx)) * 4;
                            r += tempData[i];
                            g += tempData[i + 1];
                            b += tempData[i + 2];
                            a += tempData[i + 3];
                            count++;
                        }
                    }
                    r /= count; g /= count; b /= count; a /= count;
                    ctx.fillStyle = `rgba(${r},${g},${b},${a/255})`;
                    ctx.fillRect(x, y, size, size);
                }
            }
        }

        function applyBlur() {
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            const tempData = new Uint8ClampedArray(data);
            const radius = Math.max(1, Math.floor(3 * intensity));
            for (let y = radius; y < canvas.height - radius; y++) {
                for (let x = radius; x < canvas.width - radius; x++) {
                    let r = 0, g = 0, b = 0, a = 0, count = 0;
                    for (let dy = -radius; dy <= radius; dy++) {
                        for (let dx = -radius; dx <= radius; dx++) {
                            const i = ((y + dy) * canvas.width + (x + dx)) * 4;
                            if (i < data.length && i >= 0) {
                                r += tempData[i];
                                g += tempData[i + 1];
                                b += tempData[i + 2];
                                a += tempData[i + 3];
                                count++;
                            }
                        }
                    }
                    const i = (y * canvas.width + x) * 4;
                    data[i] = r / count;
                    data[i + 1] = g / count;
                    data[i + 2] = b / count;
                    data[i + 3] = a / count;
                }
            }
            ctx.putImageData(imageData, 0, 0);
        }

        function applyVHS(data) {
            for (let i = 0; i < data.length; i += 4) {
                if (Math.random() < 0.02 * intensity && data[i + 3] > 10) {
                    data[i] = Math.random() * 255;
                    data[i + 1] = Math.random() * 255;
                    data[i + 2] = Math.random() * 255;
                }
            }
            for (let y = 0; y < canvas.height; y += 8) {
                if (Math.random() < 0.1 * intensity) {
                    for (let x = 0; x < canvas.width; x++) {
                        const i = (y * canvas.width + x) * 4;
                        if (i < data.length && data[i + 3] > 10) {
                            data[i] = data[i] * 0.2;
                            data[i + 1] = data[i + 1] * 0.2;
                            data[i + 2] = data[i + 2] * 0.2;
                        }
                    }
                }
            }
        }

        function applyInvert(data) {
            for (let i = 0; i < data.length; i += 4) {
                if (data[i + 3] > 10) {
                    data[i] = 255 - data[i];
                    data[i + 1] = 255 - data[i + 1];
                    data[i + 2] = 255 - data[i + 2];
                }
            }
        }

        function applySepia(data) {
            const f = intensity;
            for (let i = 0; i < data.length; i += 4) {
                if (data[i + 3] > 10) {
                    const r = data[i];
                    const g = data[i + 1];
                    const b = data[i + 2];
                    data[i] = Math.min(255, (r * 0.393 + g * 0.769 + b * 0.189) * f + (1 - f) * r);
                    data[i + 1] = Math.min(255, (r * 0.349 + g * 0.686 + b * 0.168) * f + (1 - f) * g);
                    data[i + 2] = Math.min(255, (r * 0.272 + g * 0.534 + b * 0.131) * f + (1 - f) * b);
                }
            }
        }

        function applyNegative(data) {
            const f = intensity;
            for (let i = 0; i < data.length; i += 4) {
                if (data[i + 3] > 10) {
                    data[i] = data[i] * (1 - f) + (255 - data[i]) * f;
                    data[i + 1] = data[i + 1] * (1 - f) + (255 - data[i + 1]) * f;
                    data[i + 2] = data[i + 2] * (1 - f) + (255 - data[i + 2]) * f;
                }
            }
        }

        function applyPosterize(data) {
            const levels = Math.max(2, Math.floor(8 / intensity));
            for (let i = 0; i < data.length; i += 4) {
                if (data[i + 3] > 10) {
                    data[i] = Math.floor(data[i] / levels) * levels;
                    data[i + 1] = Math.floor(data[i + 1] / levels) * levels;
                    data[i + 2] = Math.floor(data[i + 2] / levels) * levels;
                }
            }
        }

        function applyEmboss(data) {
            const tempData = new Uint8ClampedArray(data);
            const f = intensity * 0.5;
            for (let y = 1; y < canvas.height - 1; y++) {
                for (let x = 1; x < canvas.width - 1; x++) {
                    const i = (y * canvas.width + x) * 4;
                    if (data[i + 3] > 10) {
                        const i1 = (y * canvas.width + (x + 1)) * 4;
                        const i2 = ((y + 1) * canvas.width + x) * 4;
                        const r = (tempData[i1] + tempData[i2] - tempData[i]) * f + 128;
                        const g = (tempData[i1 + 1] + tempData[i2 + 1] - tempData[i + 1]) * f + 128;
                        const b = (tempData[i1 + 2] + tempData[i2 + 2] - tempData[i + 2]) * f + 128;
                        data[i] = Math.min(255, Math.max(0, r));
                        data[i + 1] = Math.min(255, Math.max(0, g));
                        data[i + 2] = Math.min(255, Math.max(0, b));
                    }
                }
            }
        }

        function applyEdge(data) {
            const tempData = new Uint8ClampedArray(data);
            const f = intensity * 0.3;
            for (let y = 1; y < canvas.height - 1; y++) {
                for (let x = 1; x < canvas.width - 1; x++) {
                    const i = (y * canvas.width + x) * 4;
                    if (data[i + 3] > 10) {
                        const gx = -tempData[(y * canvas.width + (x - 1)) * 4] + tempData[(y * canvas.width + (x + 1)) * 4];
                        const gy = -tempData[((y - 1) * canvas.width + x) * 4] + tempData[((y + 1) * canvas.width + x) * 4];
                        const val = Math.min(255, Math.sqrt(gx * gx + gy * gy) * f);
                        data[i] = val;
                        data[i + 1] = val;
                        data[i + 2] = val;
                    }
                }
            }
        }

        function applyOil() {
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            const tempData = new Uint8ClampedArray(data);
            const radius = Math.max(1, Math.floor(3 * intensity));
            
            for (let y = radius; y < canvas.height - radius; y++) {
                for (let x = radius; x < canvas.width - radius; x++) {
                    const i = (y * canvas.width + x) * 4;
                    if (data[i + 3] > 10) {
                        const hist = {};
                        for (let dy = -radius; dy <= radius; dy++) {
                            for (let dx = -radius; dx <= radius; dx++) {
                                const idx = ((y + dy) * canvas.width + (x + dx)) * 4;
                                const key = Math.floor(tempData[idx] / 16) * 16 +
                                           Math.floor(tempData[idx + 1] / 16) * 16 * 16 +
                                           Math.floor(tempData[idx + 2] / 16) * 16 * 256;
                                hist[key] = (hist[key] || 0) + 1;
                            }
                        }
                        let maxKey = 0, maxCount = 0;
                        for (const [key, count] of Object.entries(hist)) {
                            if (count > maxCount) {
                                maxCount = count;
                                maxKey = parseInt(key);
                            }
                        }
                        const r = (maxKey & 0xFF);
                        const g = (maxKey >> 8) & 0xFF;
                        const b = (maxKey >> 16) & 0xFF;
                        data[i] = r;
                        data[i + 1] = g;
                        data[i + 2] = b;
                    }
                }
            }
            ctx.putImageData(imageData, 0, 0);
        }

        // =============================================
        // УПРАВЛЕНИЕ
        // =============================================

        function setEffect(effect) {
            currentEffect = effect;
            const names = {
                original: '🎬 Оригинал',
                glitch: '💥 Глитч',
                pixel: '🧊 Пиксели',
                blur: '🌫️ Размытие',
                vhs: '📼 VHS',
                invert: '🎨 Инверсия',
                sepia: '🟫 Сепия',
                negative: '🔄 Негатив',
                posterize: '🎨 Постеризация',
                emboss: '🔲 Тиснение',
                edge: '✏️ Контуры',
                oil: '🖼️ Масло'
            };
            effectName.textContent = names[effect] || effect;
            
            document.querySelectorAll('#controls .effect-grid button').forEach(btn => {
                btn.classList.remove('active');
            });
            if (event && event.target) {
                event.target.classList.add('active');
            }
        }

        function togglePlay() {
            isPlaying = !isPlaying;
            const btn = document.getElementById('playBtn');
            if (isPlaying) {
                video.play();
                btn.textContent = '⏸️ ПАУЗА';
                btn.style.background = '#00ff88';
                btn.style.color = '#000';
            } else {
                video.pause();
                btn.textContent = '▶️ ВОСПРОИЗВЕДЕНИЕ';
                btn.style.background = '#ff3366';
                btn.style.color = '#fff';
            }
        }

        function resetVideo() {
            video.currentTime = 0;
            if (!isPlaying) {
                isPlaying = true;
                video.play();
                document.getElementById('playBtn').textContent = '⏸️ ПАУЗА';
                document.getElementById('playBtn').style.background = '#00ff88';
                document.getElementById('playBtn').style.color = '#000';
            }
        }

        video.load();
        console.log('🔥 ВИДЕО С ПРОЗРАЧНОСТЬЮ ГОТОВО! Меняй фон и накладывай эффекты.');
    </script>
</body>
</html>
