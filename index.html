<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой первый видеомонтаж кодом</title>
    <style>
        /* Бро, чисто для красоты, чтобы было видно все элементы */
        body {
            background: #111;
            color: #00ffcc;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        h1 { color: #fff; }
        .container {
            background: #1a1a1a;
            padding: 20px;
            border-radius: 16px;
            border: 1px solid #333;
        }
        canvas {
            display: block;
            border-radius: 12px;
            box-shadow: 0 0 40px rgba(0, 255, 200, 0.15);
            width: 640px;
            height: 360px;
            background: #000;
        }
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            background: #00ffcc;
            border: none;
            color: #111;
            font-weight: bold;
            padding: 10px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.2s;
        }
        button:hover {
            background: #fff;
            transform: scale(1.05);
        }
        .slider-box {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #222;
            padding: 5px 15px;
            border-radius: 30px;
        }
        input[type="range"] {
            width: 200px;
            background: #333;
            accent-color: #00ffcc;
        }
    </style>
</head>
<body>

    <h1>🎬 Мой видеомонтаж в коде</h1>
    <div class="container">
        <!-- Это место, где будем рисовать наше видео -->
        <canvas id="canvas" width="640" height="360"></canvas>

        <div class="controls">
            <!-- Кнопки управления -->
            <button id="playBtn">▶ Плей</button>
            <button id="pauseBtn">⏸ Пауза</button>
            <button id="glitchBtn">💥 Глитч (сдвиг RGB)</button>
            <button id="resetBtn">🔄 Очистить эффекты</button>
            
            <!-- Ползунок, чтобы перематывать видео мышкой -->
            <div class="slider-box">
                <span>⏪</span>
                <input type="range" id="seekSlider" min="0" max="100" value="0">
                <span>⏩</span>
            </div>
        </div>
        <p style="color:#666; font-size:14px; margin-top:10px;">✨ Твой файл: <strong style="color:#fff;">ssstik.io_1786111902591.mp4</strong></p>
    </div>

    <script>
        // ============================================
        // БРО, ТУТ ВСЯ МАГИЯ. РАЗБЕРЕМ ПО КОСТОЧКАМ
        // ============================================

        // 1. Берем наш canvas и говорим, что будем рисовать в 2D
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // 2. Создаем видео-элемент в памяти
        const video = document.createElement('video');
        // Указываем путь к твоему файлу в корневой папке
        video.src = 'ssstik.io_1786111902591.mp4';
        // Чтобы видео не тянулось бесконечно, если короткое
        video.loop = false;
        // Обязательно загружаем метаданные (длительность, размер)
        video.load();

        // 3. Ждем, пока видео загрузится, чтобы узнать его длину
        let videoDuration = 0;
        video.addEventListener('loadedmetadata', () => {
            videoDuration = video.duration;
            console.log('Длительность видео (сек):', videoDuration);
            // Показываем первый кадр сразу
            drawFrame();
        });

        // 4. Переменные для управления воспроизведением
        let isPlaying = false;
        let animationFrameId = null;
        let glitchActive = false; // Режим глитча

        // 5. ГЛАВНАЯ ФУНКЦИЯ, которая рисует один кадр на Canvas
        function drawFrame() {
            // Если видео еще не загрузилось — выходим
            if (video.readyState < 2) return;

            // --- ШАГ А: Рисуем оригинальное видео ---
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // --- ШАГ Б: Накладываем эффекты (если включены) ---
            if (glitchActive) {
                applyGlitchEffect();
            }
        }

        // 6. ФУНКЦИЯ ГЛИТЧА (та самая магия)
        function applyGlitchEffect() {
            // Берем пиксели с текущего канваса
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;

            // Проходим по пикселям и сдвигаем цветовые каналы
            for (let i = 0; i < data.length; i += 4) {
                // Случайный сдвиг для красного канала (в пределах 10 пикселей)
                const shift = Math.floor(Math.random() * 10);
                // Сохраняем оригинальные значения
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];

                // Меняем местами/сдвигаем каналы, чтобы получить "глитч"
                // Красный берем от соседнего пикселя (эмуляция разрыва)
                if (i + shift * 4 < data.length) {
                    data[i] = data[i + shift * 4];       // R сдвигаем
                    data[i + 1] = g;                     // G оставляем
                    data[i + 2] = b;                     // B оставляем
                }
                
                // Добавляем немного "шума" для реалистичности (делаем каждый 20-й пиксель белым)
                if (i % 20 === 0) {
                    data[i] = 255;
                    data[i + 1] = 255;
                    data[i + 2] = 255;
                }
            }

            // Возвращаем измененные пиксели обратно на канвас
            ctx.putImageData(imageData, 0, 0);
        }

        // 7. ЦИКЛ ВОСПРОИЗВЕДЕНИЯ (как бесконечный loop в игре)
        function playLoop() {
            if (!isPlaying) return;

            // Обновляем время видео (следующий кадр)
            if (video.currentTime < video.duration) {
                video.currentTime += 0.033; // примерно 30 кадров в секунду
                drawFrame();
                
                // Обновляем ползунок, чтобы он двигался вместе с видео
                const progress = (video.currentTime / video.duration) * 100;
                document.getElementById('seekSlider').value = progress;
            } else {
                // Если видео закончилось — останавливаем
                isPlaying = false;
                return;
            }

            // Запускаем следующий кадр через 33 мс
            animationFrameId = setTimeout(playLoop, 33);
        }

        // 8. УПРАВЛЕНИЕ КНОПКАМИ
        document.getElementById('playBtn').addEventListener('click', () => {
            if (video.currentTime >= video.duration) {
                video.currentTime = 0; // перезапуск, если закончилось
            }
            isPlaying = true;
            video.play(); // Запускаем звук/время в самом видео (для синхронизации)
            playLoop();
        });

        document.getElementById('pauseBtn').addEventListener('click', () => {
            isPlaying = false;
            video.pause();
            if (animationFrameId) {
                clearTimeout(animationFrameId);
                animationFrameId = null;
            }
        });

        document.getElementById('glitchBtn').addEventListener('click', () => {
            glitchActive = !glitchActive; // Включаем/выключаем
            if (glitchActive) {
                document.getElementById('glitchBtn').style.background = '#ff3366';
                document.getElementById('glitchBtn').style.color = '#fff';
            } else {
                document.getElementById('glitchBtn').style.background = '#00ffcc';
                document.getElementById('glitchBtn').style.color = '#111';
                // Перерисовываем чистый кадр, чтобы убрать глитч
                drawFrame();
            }
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            // Сброс эффектов и на начало видео
            glitchActive = false;
            document.getElementById('glitchBtn').style.background = '#00ffcc';
            document.getElementById('glitchBtn').style.color = '#111';
            video.currentTime = 0;
            document.getElementById('seekSlider').value = 0;
            drawFrame();
        });

        // 9. УПРАВЛЕНИЕ ПОЛЗУНКОМ (перемотка мышкой)
        document.getElementById('seekSlider').addEventListener('input', (e) => {
            if (video.duration) {
                const percent = e.target.value / 100;
                video.currentTime = percent * video.duration;
                drawFrame();
            }
        });

        // 10. ДОПОЛНИТЕЛЬНО: Чтобы видео подгружалось и показывало кадр при готовности
        video.addEventListener('canplay', () => {
            drawFrame();
        });

        // Если ты захочешь поменять видео, просто замени название в 24-й строке
        console.log('💪 Всё готово, бро! Жми Плей и экспериментируй.');
    </script>
</body>
</html>
