<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Video Editor Lab</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0b0e;
            color: #00ffcc;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .lab-container {
            position: relative;
            box-shadow: 0 0 40px rgba(0, 255, 204, 0.15);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(0, 255, 204, 0.3);
        }

        /* Прячем исходный тег видео, оставляем только канву, куда код рендерит кадры */
        video {
            display: none;
        }

        canvas {
            display: block;
            max-width: 100%;
            height: auto;
            background: #000;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
        }

        button {
            background: transparent;
            color: #00ffcc;
            border: 1px solid #00ffcc;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-family: monospace;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        button:hover {
            background: #00ffcc;
            color: #0b0b0e;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.5);
        }
    </style>
</head>
<body>

    <div class="lab-container">
        <!-- Твое видео из корневой папки -->
        <video id="sourceVideo" src="ssstik.io_1786111902591.mp4" crossorigin="anonymous" autoplay muted loop playsinline></video>
        <!-- Канва, на которой код будет "пересобирать" каждый кадр -->
        <canvas id="videoCanvas"></canvas>
    </div>

    <div class="controls">
        <button id="glitchBtn">Включить Глитч</button>
        <button id="filterBtn">Цветокор: Киберпанк</button>
    </div>

    <script>
        const video = document.getElementById('sourceVideo');
        const canvas = document.getElementById('videoCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });

        let glitchActive = false;
        let cyberpunkFilter = false;

        // Подстраиваем размеры канвы под реальный размер видео, когда оно загрузится
        video.addEventListener('loadedmetadata', () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            renderFrame();
        });

        // Кнопки управления эффектами
        document.getElementById('glitchBtn').addEventListener('click', () => {
            glitchActive = !glitchActive;
            document.getElementById('glitchBtn').style.background = glitchActive ? '#00ffcc' : 'transparent';
            document.getElementById('glitchBtn').style.color = glitchActive ? '#0b0b0e' : '#00ffcc';
        });

        document.getElementById('filterBtn').addEventListener('click', () => {
            cyberpunkFilter = !cyberpunkFilter;
            document.getElementById('filterBtn').style.background = cyberpunkFilter ? '#00ffcc' : 'transparent';
            document.getElementById('filterBtn').style.color = cyberpunkFilter ? '#0b0b0e' : '#00ffcc';
        });

        // Главный цикл покадрового монтажа
        function renderFrame() {
            if (!video.paused && !video.ended) {
                // 1. Рисуем чистый кадр из видео на канву
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                // 2. Если включен кастомный киберпанк-фильтр (манипуляция с пикселями)
                if (cyberpunkFilter) {
                    let frameData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    let pixels = frameData.data;
                    for (let i = 0; i < pixels.length; i += 4) {
                        pixels[i]     = pixels[i] * 0.8;       // Уменьшаем красный
                        pixels[i + 1] = pixels[i + 1] * 1.2;   // Усиливаем зеленый
                        pixels[i + 2] = pixels[i + 2] * 1.5;   // Усиливаем синий (неоновый оттенок)
                    }
                    ctx.putImageData(frameData, 0, 0);
                }

                // 3. Если включен глитч-эффект (математический сдвиг строк пикселей)
                if (glitchActive && Math.random() > 0.7) {
                    let sliceHeight = Math.floor(Math.random() * 20) + 5;
                    let y = Math.floor(Math.random() * (canvas.height - sliceHeight));
                    let xOffset = (Math.random() - 0.5) * 40;
                    
                    let sliceData = ctx.getImageData(0, y, canvas.width, sliceHeight);
                    ctx.putImageData(sliceData, xOffset, y);
                }
            }
            
            // Зацикливаем отрисовку под частоту кадров монитора (обычно 60 FPS)
            requestAnimationFrame(renderFrame);
        }
    </script>
</body>
</html>
