<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hardcore Web Video Lab</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #030305;
            color: #00ffcc;
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .viewport-wrapper {
            position: relative;
            box-shadow: 0 0 50px rgba(0, 255, 204, 0.25);
            border: 2px solid #00ffcc;
            border-radius: 8px;
            background: #000;
            overflow: hidden;
        }

        /* Прячем дефолтный тег, всё рендерим через тяжелый GPU-контекст канвы */
        video {
            display: none;
        }

        canvas {
            display: block;
            max-width: 85vw;
            max-height: 70vh;
            object-fit: contain;
        }

        .hud-panel {
            margin-top: 20px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            background: #030305;
            color: #00ffcc;
            border: 1px solid #00ffcc;
            padding: 12px 24px;
            border-radius: 4px;
            cursor: pointer;
            font-family: monospace;
            font-weight: bold;
            font-size: 14px;
            text-transform: uppercase;
            transition: all 0.15s ease;
        }

        button:hover {
            background: #00ffcc;
            color: #030305;
            box-shadow: 0 0 20px #00ffcc;
        }

        button.active {
            background: #ff0055;
            border-color: #ff0055;
            color: #fff;
            box-shadow: 0 0 20px #ff0055;
        }

        .info-bar {
            margin-top: 10px;
            font-size: 12px;
            color: #55ffcc;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="viewport-wrapper">
        <!-- Твое точное название файла, ни байта не меняем -->
        <video id="sourceVideo" src="ssstik.io_1786111902591.mp4" crossorigin="anonymous" muted loop playsinline></video>
        <canvas id="matrixCanvas"></canvas>
    </div>

    <div class="hud-panel">
        <button id="startBtn">▶ Запуск ядра</button>
        <button id="glitchToggle">⚠️ RGB-Глитч</button>
        <button id="matrixToggle">🟢 Цифровой шум</button>
        <button id="strobeToggle">⚡ Стробоскоп</button>
    </div>

    <div class="info-bar" id="logStatus">Система ожидает инициализации потока...</div>

    <script>
        const video = document.getElementById('sourceVideo');
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const logStatus = document.getElementById('logStatus');

        let isRunning = false;
        let glitchOn = false;
        let matrixNoiseOn = false;
        let strobeOn = false;

        // Кнопки переключения режимов
        document.getElementById('glitchToggle').addEventListener('click', (e) => {
            glitchOn = !glitchOn;
            e.target.classList.toggle('active', glitchOn);
        });

        document.getElementById('matrixToggle').addEventListener('click', (e) => {
            matrixNoiseOn = !matrixNoiseOn;
            e.target.classList.toggle('active', matrixNoiseOn);
        });

        document.getElementById('strobeToggle').addEventListener('click', (e) => {
            strobeOn = !strobeOn;
            e.target.classList.toggle('active', strobeOn);
        });

        document.getElementById('startBtn').addEventListener('click', () => {
            video.play().then(() => {
                isRunning = true;
                document.getElementById('startBtn').style.display = 'none';
                logStatus.innerText = `Поток активен [РАЗРЕШЕНИЕ: ${video.videoWidth}x${video.videoHeight}]`;
                requestAnimationFrame(processFrame);
            }).catch(err => {
                logStatus.innerText = "КРИТИЧЕСКАЯ ОШИБКА: Браузер заблокировал автозапуск. Нужен локальный сервер!";
                console.error(err);
            });
        });

        // Главный процессор кадров (монтаж на лету кодом)
        function processFrame() {
            if (!isRunning) return;

            if (!video.paused && !video.ended) {
                // 1. Базовый рендер кадра с видео в канву
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                // Вытаскиваем массив пикселей текущего кадра для математических издевательств
                let frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
                let data = frame.data;

                // 2. Эффект цифрового матричного шума и зеленым подкрасом
                if (matrixNoiseOn) {
                    for (let i = 0; i < data.length; i += 4) {
                        let noise = (Math.random() - 0.5) * 50;
                        data[i]     = clamp(data[i] * 0.2 + noise);       // R
                        data[i + 1] = clamp(data[i + 1] * 1.4 + noise);   // G (акцент на зеленый)
                        data[i + 2] = clamp(data[i + 2] * 0.3 + noise);   // B
                    }
                }

                // 3. Стробоскоп (резкое инвертирование яркости)
                if (strobeOn && Math.random() > 0.8) {
                    for (let i = 0; i < data.length; i += 4) {
                        data[i]     = 255 - data[i];
                        data[i + 1] = 255 - data[i + 1];
                        data[i + 2] = 255 - data[i + 2];
                    }
                }

                // Заливаем измененный массив обратно в кадр
                ctx.putImageData(frame, 0, 0);

                // 4. Жесткий RGB-глитч (разрыв и сдвиг горизонтальных полос по каналам)
                if (glitchOn && Math.random() > 0.4) {
                    let slicesCount = Math.floor(Math.random() * 5) + 2;
                    for (let s = 0; s < slicesCount; s++) {
                        let sliceHeight = Math.floor(Math.random() * 30) + 5;
                        let yCoord = Math.floor(Math.random() * (canvas.height - sliceHeight));
                        let xShift = (Math.random() - 0.5) * 70;
                        
                        let slice = ctx.getImageData(0, yCoord, canvas.width, sliceHeight);
                        ctx.putImageData(slice, xShift, yCoord);
                    }
                }
            }

            requestAnimationFrame(processFrame);
        }

        // Автоматическая подгонка размеров канвы под реальный размер твоего файла
        video.addEventListener('loadedmetadata', () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
        });

        function clamp(val) {
            return Math.max(0, Math.min(255, val));
        }
    </script>
</body>
</html>
