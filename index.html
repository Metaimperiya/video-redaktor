<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Video Lab</title>
    <style>
        body {
            background: #0b0b0e;
            color: #00ffcc;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .box {
            border: 2px solid #00ffcc;
            border-radius: 10px;
            padding: 15px;
            background: #000;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
            text-align: center;
        }
        video {
            display: block;
            max-width: 320px;
            width: 100%;
            height: auto;
            border-radius: 6px;
        }
        .status {
            margin-top: 15px;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="box">
        <!-- Короткое и понятное имя файла без точек в названии -->
        <video id="v" src="video.mp4" controls autoplay muted loop playsinline></video>
        <div class="status" id="st">Статус: загрузка видео...</div>
    </div>

    <script>
        const v = document.getElementById('v');
        const st = document.getElementById('st');

        v.addEventListener('loadeddata', () => {
            st.innerText = `Видео в норме: ${v.videoWidth}x${v.videoHeight}px`;
        });

        v.addEventListener('error', () => {
            st.innerText = "Ошибка: файл video.mp4 не найден в корне!";
        });
    </script>
</body>
</html>
